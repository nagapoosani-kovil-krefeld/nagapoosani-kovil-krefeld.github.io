name: Fix Aadipooram Tamil caption

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-aadipooram-caption.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Correct Aadipooram Tamil gallery caption
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          old = '"Ambaal im Festschmuck": "திருவிழா அலங்காரத்தில் அம்பாள்"'
          new = '"Ambaal im Festschmuck": "ஆடிப்பூரத் திருவிழாவில் அம்பாள்"'
          if old not in text:
              raise SystemExit('Expected Tamil gallery caption not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html, count = re.subn(r'script\.js\?v=(\d{8})-(\d+)', lambda m: f"script.js?v={m.group(1)}-{int(m.group(2))+1}", html, count=1)
          if count != 1:
              raise SystemExit('Script cache-bust reference not found')
          index.write_text(html, encoding='utf-8')

      - name: Commit caption correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- script.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Correct Aadipooram Tamil gallery caption"
          git push origin main
