name: Fix contact logo placement

on:
  push:
    branches:
      - agent/tamil-natural-review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tamil-natural-review
      - name: Correct contact logo and restore header logo
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old = 'style="width:82px;height:82px;margin:24px 0 16px;object-fit:contain;border-radius:50%;background:rgba(255,253,248,.78);box-shadow:0 10px 28px rgba(13,43,42,.10)"'
          new = 'style="width:96px;height:96px;margin:24px auto 16px;display:block;object-fit:contain;border-radius:50%;background:rgba(255,253,248,.78);box-shadow:0 10px 28px rgba(13,43,42,.10)"'
          if old not in html:
              raise SystemExit('Contact logo inline style not found')
          index.write_text(html.replace(old, new, 1), encoding='utf-8')

          styles = Path('styles.css')
          css = styles.read_text(encoding='utf-8')
          old_header = '''.brand img {
  width: 56px; height: 56px; object-fit: contain; background: transparent;
  border-radius: 0; box-shadow: none;
}'''
          new_header = '''.brand img {
  width: 72px; height: 72px; object-fit: contain; background: white;
  border-radius: 50%; box-shadow: 0 6px 20px rgba(10, 44, 41, 0.1);
}'''
          if old_header not in css:
              raise SystemExit('Modified header logo rule not found')
          styles.write_text(css.replace(old_header, new_header, 1), encoding='utf-8')
          PY
          git rm .github/workflows/fix-contact-logo.yml
      - name: Commit correction
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html styles.css .github/workflows/fix-contact-logo.yml
          git commit -m "Adjust contact logo size and alignment"
          git push origin HEAD:agent/tamil-natural-review
