name: Update Tamil Archanai wording

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-tamil-archanai.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Tamil Archanai wording only
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '"Persönliche Gebete · Opfergaben": "தனிப்பட்ட பிரார்த்தனைகள் · காணிக்கைகள்"': '"Persönliche Gebete · Opfergaben": "தனிப்பட்ட வேண்டுதல்கள் · காணிக்கைகள்"',
            '"Archanai – ein persönliches Gebet an Ambaal": "அர்ச்சனை – அம்பாளிடம் ஒரு தனிப்பட்ட பிரார்த்தனை"': '"Archanai – ein persönliches Gebet an Ambaal": "அர்ச்சனை – அம்பாளுக்கான தனிப்பட்ட வழிபாடு"',
            '"Eine Archanai ist ein besonderer Moment der Hingabe an Sri Nagapoosani Ambaal. Gläubige können ihre Wünsche, Sorgen und ihren Dank vertrauensvoll vor Ambaal bringen und für sich und ihre Familie um Schutz, Kraft und Segen bitten.": "அர்ச்சனை என்பது ஸ்ரீ நாகபூசணி அம்பாளிடம் பக்தியுடன் ஒன்றிணையும் ஒரு விசேட தருணமாகும். அடியவர்கள் தங்களது விருப்பங்கள், கவலைகள் மற்றும் நன்றியை நம்பிக்கையுடன் அம்பாளிடம் சமர்ப்பித்து, தங்களுக்கும் தங்கள் குடும்பத்தினருக்கும் பாதுகாப்பு, வலிமை மற்றும் அருளை வேண்டலாம்."': '"Eine Archanai ist ein besonderer Moment der Hingabe an Sri Nagapoosani Ambaal. Gläubige können ihre Wünsche, Sorgen und ihren Dank vertrauensvoll vor Ambaal bringen und für sich und ihre Familie um Schutz, Kraft und Segen bitten.": "அர்ச்சனை என்பது ஸ்ரீ நாகபூசணி அம்பாளுக்குச் செய்யப்படும் தனிப்பட்ட வழிபாடாகும். பக்தர்கள் தங்கள் வேண்டுதல்கள், கவலைகள் மற்றும் நன்றிகளை அம்பாளின் திருவடிகளில் சமர்ப்பித்து, தமக்கும் தங்கள் குடும்பத்தினருக்கும் நலம், பாதுகாப்பு, மனவலிமை மற்றும் திருவருள் வேண்டிக்கொள்ளலாம்."',
            '"In der Hoffnung auf Ambaals Gnade werden die persönlichen Anliegen in die Verehrung eingebracht. Verschiedene Formen der Archanai können direkt am Empfang ausgewählt werden.": "அம்பாளின் அருளை நம்பி, தனிப்பட்ட வேண்டுதல்கள் வழிபாட்டில் இணைக்கப்படுகின்றன. பல்வேறு வகையான அர்ச்சனைகளை வரவேற்புப் பகுதியில் நேரடியாகத் தேர்ந்தெடுக்கலாம்."': '"In der Hoffnung auf Ambaals Gnade werden die persönlichen Anliegen in die Verehrung eingebracht. Verschiedene Formen der Archanai können direkt am Empfang ausgewählt werden.": "அம்பாளின் அருளை நாடி தங்கள் தனிப்பட்ட வேண்டுதல்களுக்காக அர்ச்சனை செய்யலாம். தேவைக்கேற்ற அர்ச்சனை வகைகளை ஆலய வரவேற்பிடத்தில் நேரடியாகத் தெரிவு செய்யலாம்."',
            '"Mit Vertrauen und Hingabe": "நம்பிக்கையுடனும் பக்தியுடனும்"': '"Mit Vertrauen und Hingabe": "நம்பிக்கையோடும் பக்தியோடும்"',
            '"Am Empfang erhältlich": "வரவேற்புப் பகுதியில் பெறலாம்"': '"Am Empfang erhältlich": "வரவேற்பிடத்தில் தெரிவு செய்யலாம்"'
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Expected source text not found: {old[:80]}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Archanai wording update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Refine Tamil Archanai wording'
          git push origin main
