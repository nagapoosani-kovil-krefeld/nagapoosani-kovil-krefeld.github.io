name: Fix Tamil intro alignment

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-tamil-intro-alignment.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align Tamil temple intro at top
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          rule = 'html[lang="ta"] .intro-section .split { align-items: start; }'
          if rule not in s:
              anchor = '.split { display: grid; grid-template-columns: 1fr 0.9fr; gap: 80px; align-items: end; }'
              if anchor not in s:
                  raise SystemExit('Expected split rule not found')
              s = s.replace(anchor, anchor + '\n' + rule, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit alignment fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet || git commit -m "Fix Tamil temple intro alignment"
          git push origin main
