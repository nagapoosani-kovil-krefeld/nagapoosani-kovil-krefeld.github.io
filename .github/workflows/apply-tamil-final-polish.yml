name: Apply Tamil final polish

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-tamil-final-polish.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved Tamil text polish
        shell: python
        run: |
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'நம்பிக்கை · பாரம்பரியம் · சமூகம்': 'இறைநம்பிக்கை · வழிபாடு · சமூக ஒற்றுமை',
            'கிறிபில்டில் பொருத்தமான நிலம் ஒன்றைப் பெற்று, அதில் எமக்கென ஒரு சொந்த இந்து ஆலயத்தை அமைப்பதே எமது நீண்டகால கனவாகும். புதிய ஆலயம் பூஜைகள், திருவிழாக்கள், தமிழ் இந்து சமயப் பாரம்பரியம், கலாசார நிகழ்வுகள் மற்றும் சமூகச் சந்திப்புகள் அனைத்தும் நடைபெறக்கூடிய நிரந்தரமான ஆன்மிக இல்லமாக அமைய வேண்டும் என்பதே எமது விருப்பம்.': 'கிறிபில்டில் பொருத்தமான நிலம் ஒன்றைப் பெற்று, அதில் எமக்கென ஒரு சொந்த இந்து ஆலயத்தை அமைப்பதே எமது நீண்டகால கனவாகும். புதிய ஆலயம் பூஜைகள், திருவிழாக்கள், சமய நிகழ்வுகள், கலாசார நிகழ்வுகள் மற்றும் சமூக ஒன்றுகூடல்கள் நடைபெறும் நிரந்தரமான ஆன்மிக இல்லமாக அமைய வேண்டும் என்பதே எமது விருப்பம்.',
            'கிறிபில்ட் ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம் – நம்பிக்கை, தமிழ் இந்து பாரம்பரியம் மற்றும் சமூக ஒற்றுமைக்கான ஓர் இடம்.': 'கிறிபில்ட் ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம் – இறைவழிபாடும் சமூக ஒற்றுமையும் நிறைந்த புனிதத் தலம்.',
            'பாரம்பரிய ஆலய இசை': 'நாதஸ்வரம் · தவில் இசை',
            'பாரம்பரிய ஆலய இசைப் படத்தைப் பெரிதாகத் திறக்கவும்': 'நாதஸ்வரம் மற்றும் தவில் இசைப் படத்தைப் பெரிதாகத் திறக்கவும்'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          import re
          html, count = re.subn(r'script\.js\?v=(\d{8})-(\d+)', lambda m: f"script.js?v={m.group(1)}-{int(m.group(2))+1}", html, count=1)
          if count != 1:
              raise SystemExit('Script cache-bust reference not found.')
          index.write_text(html, encoding='utf-8')

      - name: Commit live polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- script.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Polish approved Tamil copy"
          git push origin main
