name: Bold Tamil Pooja highlight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bold-tamil-pooja-highlight.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add Pooja emphasis without deleting text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # 1) Split only the Pooja paragraph structurally so one sentence can be bold.
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<p>Im Anschluss an das Abhishekam findet die gemeinsame Pooja statt. Die jeweiligen Beginnzeiten finden Sie im Wochenplan.</p>'
          new = '<p>Im Anschluss an das Abhishekam findet die gemeinsame Pooja statt. <strong>Die jeweiligen Beginnzeiten finden Sie im Wochenplan.</strong><span aria-hidden="true">\u200b</span></p>'
          if old not in s:
              raise SystemExit('Expected Pooja paragraph not found in index.html; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # 2) Add split translation keys. Existing approved Tamil copy is preserved verbatim.
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')

          old_ta = '  "Im Anschluss an das Abhishekam findet die gemeinsame Pooja statt. Die jeweiligen Beginnzeiten finden Sie im Wochenplan.": "அபிஷேகம் நிறைவடைந்த பின்னர் பொதுப் பூஜை நடைபெறும். இந்த நேரத்தில் ஆலயத்தில் ஒரு அமைதியான மற்றும் பக்தி நிறைந்த சூழல் உருவாகிறது. மந்திரங்கள் ஓதப்பட்டு, தீபாராதனை மற்றும் விசேஷ வழிபாடுகள் நடைபெறும் போது, வருகை தரும் அனைவரும் அமைதியாக இருந்து அம்பாளை தரிசிக்கலாம். குடும்பத்தினருடன் அல்லது தனியாக வருபவர்களாக இருந்தாலும், பூஜையில் கலந்து கொள்வது ஆலய வாழ்க்கையின் முக்கியமான ஒரு பகுதியாகும். பூஜையின் நிறைவில் தீபாராதனையை தரிசித்து, திருநீறு மற்றும் பிரசாதம் பெற்றுக்கொள்ளலாம். அன்றைய பூஜை ஆரம்ப நேரத்தை வார அட்டவணையில் காணலாம்.",'
          add_ta = old_ta + '\n  "Im Anschluss an das Abhishekam findet die gemeinsame Pooja statt.": "அபிஷேகம் நிறைவடைந்த பின்னர் பொதுப் பூஜை நடைபெறும். இந்த நேரத்தில் ஆலயத்தில் ஒரு அமைதியான மற்றும் பக்தி நிறைந்த சூழல் உருவாகிறது. மந்திரங்கள் ஓதப்பட்டு, தீபாராதனை மற்றும் விசேஷ வழிபாடுகள் நடைபெறும் போது, வருகை தரும் அனைவரும் அமைதியாக இருந்து அம்பாளை தரிசிக்கலாம். குடும்பத்தினருடன் அல்லது தனியாக வருபவர்களாக இருந்தாலும், பூஜையில் கலந்து கொள்வது ஆலய வாழ்க்கையின் முக்கியமான ஒரு பகுதியாகும்.",\n  "Die jeweiligen Beginnzeiten finden Sie im Wochenplan.": "பூஜையின் நிறைவில் தீபாராதனையை தரிசித்து, திருநீறு மற்றும் பிரசாதம் பெற்றுக்கொள்ளலாம்.",\n  "\u200b": "அன்றைய பூஜை ஆரம்ப நேரத்தை வார அட்டவணையில் காணலாம்.",'
          if old_ta not in s:
              raise SystemExit('Approved Tamil Pooja text not found; no changes made.')
          s = s.replace(old_ta, add_ta, 1)

          old_en = '  "Im Anschluss an das Abhishekam findet die gemeinsame Pooja statt. Die jeweiligen Beginnzeiten finden Sie im Wochenplan.": "The communal Pooja takes place after Abhishekam. The respective starting times can be found in the weekly schedule.",'
          add_en = old_en + '\n  "Im Anschluss an das Abhishekam findet die gemeinsame Pooja statt.": "The communal Pooja takes place after Abhishekam.",\n  "Die jeweiligen Beginnzeiten finden Sie im Wochenplan.": "The respective starting times can be found in the weekly schedule.",\n  "\u200b": "\u200b",'
          if old_en not in s:
              raise SystemExit('English Pooja text not found; no changes made.')
          s = s.replace(old_en, add_en, 1)

          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Pooja highlight
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html script.js
          git commit -m 'Bold important Tamil Pooja sentence'
          git push origin main
