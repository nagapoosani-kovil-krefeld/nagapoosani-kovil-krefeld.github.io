name: Add multi-app route planner

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/add-route-planner.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add route planner chooser
        run: |
          python - <<'PY'
          from pathlib import Path

          # index.html
          p = Path('index.html')
          s = p.read_text()
          old = '''          <a class="button button-primary" href="https://www.google.com/maps/search/?api=1&amp;query=Elisabethstra%C3%9Fe+103-105%2C+47799+Krefeld" target="_blank" rel="noreferrer">Route öffnen</a>'''
          new = '''          <button class="button button-primary route-planner-button" type="button" data-route-planner>Route planen</button>'''
          if old not in s:
              raise SystemExit('Current Google Maps button not found')
          s = s.replace(old, new, 1)

          marker = '''      </section>\n    </main>'''
          dialog = '''      </section>\n\n      <dialog class="route-dialog" data-route-dialog aria-label="Navigation auswählen">\n        <div class="route-dialog-panel">\n          <button class="route-dialog-close" type="button" data-route-close aria-label="Routenplaner schließen">&#215;</button>\n          <p class="section-kicker">Route planen</p>\n          <h2>Navigation auswählen</h2>\n          <p class="route-dialog-copy">Wählen Sie Ihre bevorzugte Karten-App.</p>\n          <div class="route-options">\n            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Elisabethstra%C3%9Fe+103-105%2C+47799+Krefeld" target="_blank" rel="noreferrer">Google Maps</a>\n            <a href="https://maps.apple.com/?daddr=Elisabethstra%C3%9Fe%20103-105%2C%2047799%20Krefeld&amp;dirflg=d" target="_blank" rel="noreferrer">Apple Maps</a>\n            <a href="https://www.waze.com/ul?q=Elisabethstra%C3%9Fe%20103-105%2C%2047799%20Krefeld&amp;navigate=yes" target="_blank" rel="noreferrer">Waze</a>\n          </div>\n        </div>\n      </dialog>\n    </main>'''
          if marker not in s:
              raise SystemExit('Main closing marker not found')
          s = s.replace(marker, dialog, 1)
          s = s.replace('styles.css?v=20260821-1', 'styles.css?v=20260821-2', 1)
          s = s.replace('script.js?v=20260821-2', 'script.js?v=20260821-3', 1)
          p.write_text(s)

          # script.js translations + behavior
          p = Path('script.js')
          s = p.read_text()
          tamil_anchor = '  "Route öffnen": "ஆலயத்திற்கு வழிகாட்டி",\n'
          tamil_new = '''  "Route öffnen": "ஆலயத்திற்கு வழிகாட்டி",\n  "Route planen": "ஆலயத்திற்கு வழிகாட்டி",\n  "Navigation auswählen": "வழிகாட்டி செயலியைத் தேர்ந்தெடுக்கவும்",\n  "Wählen Sie Ihre bevorzugte Karten-App.": "நீங்கள் பயன்படுத்த விரும்பும் வரைபட செயலியைத் தேர்ந்தெடுக்கவும்.",\n'''
          if tamil_anchor not in s:
              raise SystemExit('Tamil route mapping anchor not found')
          s = s.replace(tamil_anchor, tamil_new, 1)

          english_anchor = '  "Route öffnen": "Open Directions",\n'
          english_new = '''  "Route öffnen": "Open Directions",\n  "Route planen": "Get Directions",\n  "Navigation auswählen": "Choose Navigation",\n  "Wählen Sie Ihre bevorzugte Karten-App.": "Choose your preferred maps app.",\n'''
          if english_anchor not in s:
              raise SystemExit('English route mapping anchor not found')
          s = s.replace(english_anchor, english_new, 1)

          ta_attr_anchor = '  "Rechtliche Hinweise": "சட்ட அறிவிப்புகள்"\n'
          ta_attr_new = '''  "Routenplaner schließen": "வழிகாட்டியை மூடவும்",\n  "Rechtliche Hinweise": "சட்ட அறிவிப்புகள்"\n'''
          if ta_attr_anchor not in s:
              raise SystemExit('Tamil attribute anchor not found')
          s = s.replace(ta_attr_anchor, ta_attr_new, 1)

          en_attr_anchor = '  "Rechtliche Hinweise": "Legal information"\n'
          en_attr_new = '''  "Routenplaner schließen": "Close route planner",\n  "Rechtliche Hinweise": "Legal information"\n'''
          if en_attr_anchor not in s:
              raise SystemExit('English attribute anchor not found')
          s = s.replace(en_attr_anchor, en_attr_new, 1)

          behavior_marker = 'languageButtons.forEach((button) => {\n  button.addEventListener("click", () => applyLanguage(button.dataset.language));\n});\n'
          behavior_new = '''languageButtons.forEach((button) => {\n  button.addEventListener("click", () => applyLanguage(button.dataset.language));\n});\n\nconst routePlannerButton = document.querySelector("[data-route-planner]");\nconst routeDialog = document.querySelector("[data-route-dialog]");\nconst routeDialogClose = document.querySelector("[data-route-close]");\n\nroutePlannerButton?.addEventListener("click", () => {\n  if (routeDialog && !routeDialog.open) routeDialog.showModal();\n});\nrouteDialogClose?.addEventListener("click", () => routeDialog?.close());\nrouteDialog?.addEventListener("click", (event) => {\n  if (event.target === routeDialog) routeDialog.close();\n});\nrouteDialog?.querySelectorAll(".route-options a").forEach((link) => {\n  link.addEventListener("click", () => routeDialog.close());\n});\n'''
          if behavior_marker not in s:
              raise SystemExit('Language button behavior marker not found')
          s = s.replace(behavior_marker, behavior_new, 1)
          p.write_text(s)

          # styles.css
          p = Path('styles.css')
          s = p.read_text()
          style_marker = '.contact-logo { display: block; width: 82px; height: 82px; object-fit: contain; margin: 24px auto 16px; border-radius: 50%; background: rgba(255,253,248,.78); box-shadow: 0 10px 28px rgba(13,43,42,.10); }\n'
          style_new = style_marker + '''.route-planner-button { cursor: pointer; font-family: inherit; }\n.route-dialog {\n  width: min(460px, calc(100vw - 32px)); padding: 0; border: 0; border-radius: 16px;\n  color: var(--ink); background: transparent; box-shadow: 0 28px 80px rgba(7, 31, 29, 0.3);\n}\n.route-dialog::backdrop { background: rgba(5, 25, 24, 0.58); backdrop-filter: blur(4px); }\n.route-dialog-panel { position: relative; padding: 34px; background: var(--paper); border-top: 3px solid var(--gold); }\n.route-dialog .section-kicker { margin-bottom: 10px; }\n.route-dialog h2 { margin: 0; font: 600 30px/1.15 "Cinzel", serif; }\nhtml[lang="ta"] .route-dialog h2 { font-family: "Noto Sans Tamil", sans-serif; line-height: 1.35; }\n.route-dialog-copy { margin: 12px 0 22px; color: var(--muted); line-height: 1.6; }\n.route-dialog-close {\n  position: absolute; top: 14px; right: 14px; width: 38px; height: 38px; border: 1px solid var(--line);\n  border-radius: 50%; background: transparent; color: var(--deep); cursor: pointer; font-size: 25px; line-height: 1;\n}\n.route-options { display: grid; gap: 10px; }\n.route-options a {\n  min-height: 52px; display: flex; align-items: center; padding: 0 18px; border: 1px solid var(--line);\n  border-radius: 8px; background: white; color: var(--deep); font-weight: 700; transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;\n}\n.route-options a:hover, .route-options a:focus-visible { transform: translateY(-1px); border-color: var(--gold); background: var(--cream); }\n'''
          if style_marker not in s:
              raise SystemExit('Contact logo style marker not found')
          s = s.replace(style_marker, style_new, 1)

          mobile_marker = '@media (max-width: 430px) {\n'
          mobile_new = '''@media (max-width: 430px) {\n  .route-dialog { width: 100vw; max-width: none; margin: auto 0 0; border-radius: 18px 18px 0 0; }\n  .route-dialog-panel { padding: 30px 20px 24px; }\n  .route-dialog h2 { padding-right: 42px; font-size: 25px; }\n  .route-options a { min-height: 56px; }\n'''
          if mobile_marker not in s:
              raise SystemExit('Mobile media marker not found')
          s = s.replace(mobile_marker, mobile_new, 1)
          p.write_text(s)
          PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html script.js styles.css
          git commit -m "Add multi-app route planner"
          git push origin main
