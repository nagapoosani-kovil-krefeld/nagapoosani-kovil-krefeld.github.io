name: Flatten current Pooja PDF

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/flatten-pooja-pdf.yml'

permissions:
  contents: write

jobs:
  flatten:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Install PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils
          python -m pip install --upgrade pillow
      - name: Flatten PDF and bust cache
        run: |
          set -euo pipefail
          rm -rf /tmp/pooja-flat
          mkdir -p /tmp/pooja-flat
          pdftoppm -png -r 300 dokumente/aktuelle-pooja-ankuendigung.pdf /tmp/pooja-flat/page
          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          files = sorted(Path('/tmp/pooja-flat').glob('page-*.png'))
          if not files:
              raise SystemExit('No rendered PDF pages found')
          images = [Image.open(f).convert('RGB') for f in files]
          out = Path('dokumente/aktuelle-pooja-ankuendigung.pdf')
          images[0].save(out, 'PDF', resolution=300.0, save_all=True, append_images=images[1:])

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = 'dokumente/aktuelle-pooja-ankuendigung.pdf?v=20260819-1'
          new = 'dokumente/aktuelle-pooja-ankuendigung.pdf?v=20260820-1'
          if old not in text:
              raise SystemExit('Expected PDF link version not found')
          index.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit flattened PDF
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dokumente/aktuelle-pooja-ankuendigung.pdf index.html
          git commit -m 'Flatten current Pooja PDF for consistent rendering'
          git push origin main
