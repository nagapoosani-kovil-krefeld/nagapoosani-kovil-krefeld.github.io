name: Update Tamil contact footer

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-tamil-contact-footer.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update only approved Tamil contact and footer labels
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
              '"Besucht uns": "எம்மைச் சந்தியுங்கள்"': '"Besucht uns": "ஆலயத்திற்கு வருகை தாருங்கள்"',
              '"Kontakt und Anfahrt": "தொடர்பு மற்றும் வழிகாட்டல்"': '"Kontakt und Anfahrt": "தொடர்பு மற்றும் வருகை வழி"',
              '"Route öffnen": "வழித்தடத்தைத் திறக்கவும்"': '"Route öffnen": "வருகை வழியைப் பார்க்க"',
              '"Datenschutz": "தரவுப் பாதுகாப்பு"': '"Datenschutz": "தனியுரிமை"',
          }
          for old, new in replacements.items():
              if s.count(old) != 1:
                  raise SystemExit(f'Expected exactly one match for: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit approved contact/footer changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Refine Tamil contact and footer wording'
          git push origin main
