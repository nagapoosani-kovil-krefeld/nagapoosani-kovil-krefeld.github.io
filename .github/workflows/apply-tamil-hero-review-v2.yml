name: Apply Tamil hero review v2

on:
  push:
    branches: [agent/tamil-natural-review-v2]
    paths:
      - '.github/workflows/apply-tamil-hero-review-v2.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tamil-natural-review-v2
      - name: Apply approved Tamil hero changes
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '"Tempel Krefeld": "ஆலயம் கிறிபில்ட்"': '"Tempel Krefeld": "கிறிபில்ட் ஆலயம்"',
            '"Ein Ort des Glaubens, der tamilisch-hinduistischen Tradition und der Gemeinschaft.": "இறைநம்பிக்கையும், தமிழ் இந்து மரபும், சமூக ஒற்றுமையும் இணையும் திருத்தலம்."': '"Ein Ort des Glaubens, der tamilisch-hinduistischen Tradition und der Gemeinschaft.": "இறைநம்பிக்கையும், தமிழ் இந்து மரபும், சமூக ஒற்றுமையும் இணையும் திருத்தலம்."',
            '"Wir heißen alle Menschen herzlich willkommen, unseren Tempel kennenzulernen, an Poojas teilzunehmen und unsere Gemeinschaft zu erleben.": "எமது ஆலயத்தை அறிந்துகொள்ளவும், பூஜைகளில் கலந்துகொள்ளவும், எமது சமூகத்தின் ஆன்மீக அனுபவத்தைப் பகிர்ந்துகொள்ளவும் அனைவரையும் அன்புடன் வரவேற்கிறோம்."': '"Wir heißen alle Menschen herzlich willkommen, unseren Tempel kennenzulernen, an Poojas teilzunehmen und unsere Gemeinschaft zu erleben.": "எமது ஆலயத்திற்கு வருகை தந்து, பூஜைகளில் கலந்து கொண்டு, எமது ஆன்மீக மரபையும் சமூக உறவையும் அனுபவிக்க அனைவரையும் அன்புடன் அழைக்கிறோம்."',
            '"Unseren Tempel entdecken": "எமது ஆலயத்தை அறிந்துகொள்ளுங்கள்"': '"Unseren Tempel entdecken": "எமது ஆலயத்தைப் பற்றி அறிய"',
            '"Kontakt & Anfahrt": "தொடர்பு மற்றும் வழிகாட்டல்"': '"Kontakt & Anfahrt": "தொடர்பு · வருகை வழி"',
            '"Möge ihr Segen allen zuteilwerden.": "அம்பாளின் அருள் அனைவருக்கும் கிடைக்கட்டும்."': '"Möge ihr Segen allen zuteilwerden.": "அம்பாளின் திருவருள் அனைவருக்கும் கிடைக்கட்டும்."',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected text: {old}')
              s = s.replace(old, new, 1)
          required_unchanged = '"Sri Nagapoosani Ambaal Tempel Krefeld": "ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம் கிறிபில்ட்"'
          if required_unchanged not in s:
              raise SystemExit('Temple title changed unexpectedly')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit approved review changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git diff --cached --quiet || git commit -m "Refine approved Tamil hero copy"
          git push origin agent/tamil-natural-review-v2
