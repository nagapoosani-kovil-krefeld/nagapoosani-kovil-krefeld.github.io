name: Apply final language cleanup live

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-final-language-cleanup-live.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final approved language cleanup
        shell: python
        run: |
          from pathlib import Path
          import re

          script = Path('script.js')
          text = script.read_text(encoding='utf-8')

          replacements = [
            ('de: "Sri Nagapoosani Ambaal Tempel Krefeld – ein Ort des Glaubens, der tamilisch-hinduistischen Tradition und der Gemeinschaft."',
             'de: "Sri Nagapoosani Ambaal Tempel Krefeld – ein Ort des Glaubens, der Verehrung und der Gemeinschaft."'),
            ('"und sie als Opfergabe darbringen.": "at reception and offer it as an offering."',
             '"und sie als Opfergabe darbringen.": "at reception and present it as an offering."'),
            ('"Ambaal im Festschmuck": "Ambaal in Festive Adornment"',
             '"Ambaal im Aadipooram-Alankaram": "Ambaal in Aadipooram Adornment"'),
            ('"Ambaal im Festschmuck groß öffnen": "திருவிழா அலங்காரத்தில் அம்பாளின் படத்தைப் பெரிதாகத் திறக்கவும்"',
             '"Ambaal im Aadipooram-Alankaram groß öffnen": "ஆடிப்பூர அலங்காரத்தில் அம்பாளின் படத்தைப் பெரிதாகத் திறக்கவும்"'),
            ('"Ambaal im Festschmuck groß öffnen": "Open Ambaal in festive adornment in a large view"',
             '"Ambaal im Aadipooram-Alankaram groß öffnen": "Open Ambaal in Aadipooram adornment in a large view"'),
            ('"Festlich geschmückte Sri Nagapoosani Ambaal im Tempel Krefeld": "கிறிபில்ட் ஆலயத்தில் திருவிழா அலங்காரத்தில் ஸ்ரீ நாகபூசணி அம்பாள்"',
             '"Sri Nagapoosani Ambaal im Aadipooram-Alankaram im Tempel Krefeld": "கிறிபில்ட் ஆலயத்தில் ஆடிப்பூர அலங்காரத்தில் ஸ்ரீ நாகபூசணி அம்பாள்"'),
            ('"Festlich geschmückte Sri Nagapoosani Ambaal im Tempel Krefeld": "Sri Nagapoosani Ambaal in festive adornment at the Krefeld temple"',
             '"Sri Nagapoosani Ambaal im Aadipooram-Alankaram im Tempel Krefeld": "Sri Nagapoosani Ambaal in Aadipooram adornment at the Krefeld temple"'),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'Expected script text not found: {old}')
              text = text.replace(old, new, 1)

          script.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html_replacements = [
            ('aria-label="Ambaal im Festschmuck groß öffnen"', 'aria-label="Ambaal im Aadipooram-Alankaram groß öffnen"'),
            ('alt="Festlich geschmückte Sri Nagapoosani Ambaal im Tempel Krefeld"', 'alt="Sri Nagapoosani Ambaal im Aadipooram-Alankaram im Tempel Krefeld"'),
            ('<span>Ambaal im Festschmuck</span>', '<span>Ambaal im Aadipooram-Alankaram</span>'),
            ('aria-label="Traditionelle Tempelmusik groß öffnen"', 'aria-label="Nadaswaram und Thavil Musik groß öffnen"'),
            ('<span>Traditionelle Tempelmusik</span>', '<span>Nadaswaram · Thavil Musik</span>'),
          ]
          for old, new in html_replacements:
              if old not in html:
                  raise SystemExit(f'Expected index text not found: {old}')
              html = html.replace(old, new, 1)

          html, count = re.subn(r'script\.js\?v=(\d{8})-(\d+)', lambda m: f"script.js?v={m.group(1)}-{int(m.group(2))+1}", html, count=1)
          if count != 1:
              raise SystemExit('Script cache-bust reference not found')
          index.write_text(html, encoding='utf-8')

      - name: Commit final language cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- script.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Apply final language cleanup"
          git push origin main
