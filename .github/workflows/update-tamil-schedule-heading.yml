name: Update Tamil schedule heading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-tamil-schedule-heading.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update only Tamil schedule heading
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          old = '"Pooja-Zeiten und Veranstaltungen": "பூஜை நேரங்களும் நிகழ்வுகளும்"'
          new = '"Pooja-Zeiten und Veranstaltungen": "எமது ஆலய வழிபாட்டு நேரங்கள்"'
          if old not in s:
              raise SystemExit('Expected Tamil schedule heading not found')
          if s.count(old) != 1:
              raise SystemExit('Expected exactly one matching heading')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit heading update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Refine Tamil schedule heading'
          git push origin main
