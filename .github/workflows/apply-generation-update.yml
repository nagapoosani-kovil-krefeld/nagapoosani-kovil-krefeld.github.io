name: Apply Tamil generation update

on:
  push:
    branches:
      - agent/tamil-natural-review
    paths:
      - .github/workflows/apply-generation-update.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tamil-natural-review
      - name: Update approved Tamil paragraph
        shell: python
        run: |
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          old = 'எமது ஆலயத்தின் பிரதான தெய்வமாக ஸ்ரீ நாகபூசணி அம்பாள் விளங்குகிறார். எமது சமூகத்தினர் அம்பாளை பாதுகாப்பும் அருளும் வழங்கும் தெய்வமாகப் போற்றி வழிபடுகின்றனர். பிரார்த்தனைகள், பூஜைகள் மற்றும் ஒன்றிணைந்த விழாக்கள் மூலம் எமது பாரம்பரியத்தைப் பேணிப் பாதுகாத்து அடுத்த தலைமுறைக்கு எடுத்துச் செல்கிறோம்.'
          new = 'எமது ஆலயத்தின் பிரதான தெய்வமாக ஸ்ரீ நாகபூசணி அம்பாள் விளங்குகிறார். எமது சமூகத்தினர் அம்பாளை பாதுகாப்பும் அருளும் வழங்கும் தெய்வமாகப் போற்றி வழிபடுகின்றனர். அபிஷேகம், பூஜை, அர்ச்சனை மற்றும் விசேஷ வழிபாடுகள் வழியாக இந்த இறைநம்பிக்கை தலைமுறை தலைமுறையாகப் பேணிப் பாதுகாக்கப்படுகிறது. இன்றைய இளைய தலைமுறையினர் ஆலயப் பணிகளில் செயற்பாட்டுடன் பங்கேற்று, பொறுப்புகளை ஏற்று வருகின்றனர். அவர்களின் பங்களிப்பின் மூலம் ஆலயத்தின் வழிபாடு, சேவை மற்றும் சமூகப் பணி வருங்காலத்திலும் தொடர்ந்து வளர வேண்டும் என்பதே எமது நோக்கம்.'
          if old not in text:
              raise SystemExit('Expected Tamil paragraph not found; refusing unrelated changes.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m "Update Tamil generation paragraph"
          git push origin agent/tamil-natural-review
