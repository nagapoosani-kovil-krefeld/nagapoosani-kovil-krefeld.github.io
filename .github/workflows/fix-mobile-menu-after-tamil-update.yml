name: Fix mobile menu after Tamil update

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fix-mobile-menu-after-tamil-update.yml

permissions:
  contents: write

# retrigger one-time correction
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Restore unchanged mobile menu line
        shell: python
        run: |
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          old = 'mobileMenu.classList.remove("open", !open);'
          new = 'mobileMenu.classList.remove("open");'
          if old not in text:
              raise SystemExit('Expected temporary line not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- script.js
          git diff --cached --quiet && exit 0
          git commit -m "Restore mobile menu behavior"
          git push origin main
