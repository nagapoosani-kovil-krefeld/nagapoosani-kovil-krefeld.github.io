name: Device-aware route options

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/device-route-options.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Make route options device-aware
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('script.js')
          s = p.read_text()
          old = '''routePlannerButton?.addEventListener("click", () => {
  if (routeDialog && !routeDialog.open) routeDialog.showModal();
});'''
          new = '''function updateRouteOptionsForDevice() {
  if (!routeDialog) return;
  const ua = navigator.userAgent || "";
  const isAndroid = /Android/i.test(ua);
  const appleMapsLink = routeDialog.querySelector('a[href*="maps.apple.com"]');
  if (appleMapsLink) appleMapsLink.hidden = isAndroid;
}

routePlannerButton?.addEventListener("click", () => {
  updateRouteOptionsForDevice();
  if (routeDialog && !routeDialog.open) routeDialog.showModal();
});'''
          if old not in s:
              raise SystemExit('Route planner click handler not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          old = 'script.js?v=20260821-3'
          if old in s:
              s = s.replace(old, 'script.js?v=20260821-4', 1)
          else:
              old = 'script.js?v=20260821-2'
              if old not in s:
                  raise SystemExit('Expected script cache buster not found')
              s = s.replace(old, 'script.js?v=20260821-4', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- script.js index.html
          git commit -m "Make route options device-aware"
          git push origin main

# trigger
