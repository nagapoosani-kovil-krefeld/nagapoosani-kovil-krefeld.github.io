name: Apply Tamil final content

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-tamil-final-content.yml

permissions:
  contents: write

# trigger final content update
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final Tamil content refinements
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'பால் அபிஷேகம் செலுத்தும் போது தங்கள் வேண்டுதல்களையும் பிரார்த்தனைகளையும் மனதில் கொண்டு அம்பாளை வேண்டிக்கொள்ளலாம். தங்கள் வேண்டுதல்களை அம்பாள் ஏற்று அருள்புரிவார் என்ற நம்பிக்கையுடன் பக்தர்கள் இக்காணிக்கையை செலுத்துகின்றனர்.':
            'பாலை அபிஷேகத்திற்காக வழங்கும் போது தங்கள் வேண்டுதல்களையும் பிரார்த்தனைகளையும் மனதில் கொண்டு அம்பாளை வேண்டிக்கொள்ளலாம். தங்கள் வேண்டுதல்களை அம்பாள் ஏற்று அருள்புரிவார் என்ற நம்பிக்கையுடன் பக்தர்கள் இக்காணிக்கையை வழங்குகின்றனர்.',

            'அபிஷேகம் நிறைவடைந்த பின்னர் பொதுப் பூஜை நடைபெறும். இந்த நேரத்தில் ஆலயத்தில் ஒரு அமைதியான மற்றும் பக்தி நிறைந்த சூழல் உருவாகிறது. மந்திரங்கள் ஓதப்பட்டு, தீபாராதனை மற்றும் விசேஷ வழிபாடுகள் நடைபெறும் போது, வருகை தரும் அனைவரும் அமைதியாக இருந்து அம்பாளை தரிசிக்கலாம். குடும்பத்தினருடன் அல்லது தனியாக வருபவர்களாக இருந்தாலும், பூஜையில் கலந்து கொள்வது ஆலய வாழ்க்கையின் முக்கியமான ஒரு பகுதியாகும். பூஜையின் நிறைவில் தீபாராதனையை தரிசித்து, திருநீறு மற்றும் பிரசாதம் பெற்றுக்கொள்ளலாம். அன்றைய பூஜை ஆரம்ப நேரத்தை வார அட்டவணையில் காணலாம்.':
            'அபிஷேகம் நிறைவடைந்த பின்னர் பொதுப் பூஜை நடைபெறும். மந்திரங்கள் ஓதப்பட்டு, தீபாராதனை மற்றும் விசேஷ வழிபாடுகள் நடைபெறும். பக்தர்கள் அம்பாளை தரிசித்து, பூஜையின் நிறைவில் திருநீறு மற்றும் பிரசாதம் பெற்றுக்கொள்ளலாம். அன்றைய பூஜை ஆரம்ப நேரத்தை வார அட்டவணையில் காணலாம்.',

            'அபிஷேகம் நிறைவடைந்த பின்னர் பொதுப் பூஜை நடைபெறும். இந்த நேரத்தில் ஆலயத்தில் ஒரு அமைதியான மற்றும் பக்தி நிறைந்த சூழல் உருவாகிறது. மந்திரங்கள் ஓதப்பட்டு, தீபாராதனை மற்றும் விசேஷ வழிபாடுகள் நடைபெறும் போது, வருகை தரும் அனைவரும் அமைதியாக இருந்து அம்பாளை தரிசிக்கலாம். குடும்பத்தினருடன் அல்லது தனியாக வருபவர்களாக இருந்தாலும், பூஜையில் கலந்து கொள்வது ஆலய வாழ்க்கையின் முக்கியமான ஒரு பகுதியாகும்.':
            'அபிஷேகம் நிறைவடைந்த பின்னர் பொதுப் பூஜை நடைபெறும். மந்திரங்கள் ஓதப்பட்டு, தீபாராதனை மற்றும் விசேஷ வழிபாடுகள் நடைபெறும். பக்தர்கள் அமைதியாக அம்பாளை தரிசித்து வழிபாட்டில் கலந்து கொள்ளலாம்.',

            'எமது சமய நம்பிக்கையும் தமிழ் இந்து பாரம்பரியமும் வருங்காலத் தலைமுறைகளுக்கும் தொடர வேண்டும். அதற்கான ஒரு நிரந்தரமான ஆன்மிக மையமாக இந்த புதிய ஆலயம் அமைய வேண்டும் என்று நாம் விரும்புகிறோம்.':
            'எமது இறைநம்பிக்கையும் ஆலய வழிபாடும் வருங்காலத் தலைமுறைகளுக்கும் தொடர்ந்து நிலைத்திருக்க வேண்டும். அதற்கான ஒரு நிரந்தரமான ஆன்மிக மையமாக இந்த புதிய ஆலயம் அமைய வேண்டும் என்று நாம் விரும்புகிறோம்.'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected text not found: {old[:80]}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html, count = re.subn(r'script\.js\?v=(\d{8})-(\d+)', lambda m: f"script.js?v={m.group(1)}-{int(m.group(2))+1}", html, count=1)
          if count != 1:
              raise SystemExit('Script cache-bust reference not found.')
          index.write_text(html, encoding='utf-8')

      - name: Commit final Tamil content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- script.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Finalize Tamil content balance"
          git push origin main
