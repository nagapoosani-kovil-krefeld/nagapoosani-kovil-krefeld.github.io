name: Update Tamil future section

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-tamil-future.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Tamil future section only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          replacements = {
            '"Unsere gemeinsame Zukunft": "எமது கூட்டு எதிர்காலம்"': '"Unsere gemeinsame Zukunft": "எமது எதிர்காலப் பயணம்"',
            '"Die Vision eines eigenen Tempels": "சொந்த ஆலயத்திற்கான எமது கனவு"': '"Die Vision eines eigenen Tempels": "சொந்த ஆலயத்திற்கான எமது கனவு"',
            '"Unser Sri Nagapoosani Ambaal Tempel befindet sich derzeit in einem angemieteten Gebäude in zentraler Lage der Krefelder Innenstadt. Der Tempel ist dadurch gut erreichbar, gleichzeitig stehen in der Umgebung jedoch nur begrenzte Parkmöglichkeiten zur Verfügung. Die derzeitigen Räumlichkeiten und der aktuelle Standort sind langfristig nicht passend für die Bedürfnisse einer wachsenden Tempelgemeinschaft und für größere religiöse Veranstaltungen. Dennoch ist dieser Ort für unsere Gemeinschaft sehr wertvoll.": "எமது ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம் தற்போது கிறிபில்ட் நகர மத்தியில் உள்ள ஒரு வாடகைக் கட்டிடத்தில் இயங்குகிறது. மையப்பகுதியில் இருப்பதால் ஆலயத்தை எளிதில் அடைய முடிகிறது. இருப்பினும் அருகில் வாகன நிறுத்துமிடங்கள் மிகவும் குறைவு. வளர்ந்து வரும் ஆலயச் சமூகத்தின் தேவைகளுக்கும் பெரிய சமய நிகழ்வுகளுக்கும் தற்போதைய இடமும் கட்டிட வசதிகளும் நீண்டகாலத்திற்கு பொருத்தமானவை அல்ல. இருந்தாலும் இந்த இடம் எமது சமூகத்திற்கு மிகவும் மதிப்புமிக்கதாகும்."': '"Unser Sri Nagapoosani Ambaal Tempel befindet sich derzeit in einem angemieteten Gebäude in zentraler Lage der Krefelder Innenstadt. Der Tempel ist dadurch gut erreichbar, gleichzeitig stehen in der Umgebung jedoch nur begrenzte Parkmöglichkeiten zur Verfügung. Die derzeitigen Räumlichkeiten und der aktuelle Standort sind langfristig nicht passend für die Bedürfnisse einer wachsenden Tempelgemeinschaft und für größere religiöse Veranstaltungen. Dennoch ist dieser Ort für unsere Gemeinschaft sehr wertvoll.": "எமது ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம் தற்போது கிறிபில்ட் நகர மத்தியில் உள்ள ஒரு வாடகைக் கட்டிடத்தில் இயங்கி வருகிறது. நகர மத்தியில் அமைந்துள்ளதால் பக்தர்கள் ஆலயத்தை எளிதாக அடைய முடிகிறது. இருப்பினும் வாகன நிறுத்துமிடங்களின் பற்றாக்குறையும், வளர்ந்து வரும் எமது ஆலயக் குடும்பத்தின் தேவைகளும், பெரிய சமய மற்றும் திருவிழா நிகழ்வுகளை நடத்துவதற்கான இடவசதி குறைபாடும் எதிர்காலத்தை நோக்கி புதிய இடம் ஒன்றின் தேவையை உணர்த்துகின்றன. இருந்தாலும் தற்போதைய இந்த ஆலயம் எமது சமூகத்தின் ஆன்மிக வாழ்வில் மிக முக்கியமான இடத்தை வகிக்கிறது."',
            '"Unsere Vision ist es, ein geeignetes Grundstück in Krefeld zu erwerben und darauf einen eigenen hinduistischen Tempel zu errichten. Der neue Tempel soll ein würdevoller und dauerhafter Ort für Poojas, religiöse Feste, tamilisch-hinduistische Tradition, kulturelle Begegnung und unsere Gemeinschaft werden.": "கிறிபில்டில் பொருத்தமான நிலத்தை வாங்கி, அதில் எமக்கென ஒரு இந்து ஆலயத்தை அமைப்பதே எமது கனவு. புதிய ஆலயம் பூஜைகள், சமய விழாக்கள், தமிழ் இந்து பாரம்பரியம், கலாசாரச் சந்திப்புகள் மற்றும் எமது சமூகத்திற்கான கண்ணியமான, நிரந்தரமான இடமாக அமைய வேண்டும்."': '"Unsere Vision ist es, ein geeignetes Grundstück in Krefeld zu erwerben und darauf einen eigenen hinduistischen Tempel zu errichten. Der neue Tempel soll ein würdevoller und dauerhafter Ort für Poojas, religiöse Feste, tamilisch-hinduistische Tradition, kulturelle Begegnung und unsere Gemeinschaft werden.": "கிறிபில்டில் பொருத்தமான நிலம் ஒன்றைப் பெற்று, அதில் எமக்கென ஒரு சொந்த இந்து ஆலயத்தை அமைப்பதே எமது நீண்டகால கனவாகும். புதிய ஆலயம் பூஜைகள், திருவிழாக்கள், தமிழ் இந்து சமயப் பாரம்பரியம், கலாசார நிகழ்வுகள் மற்றும் சமூகச் சந்திப்புகள் அனைத்தும் நடைபெறக்கூடிய நிரந்தரமான ஆன்மிக இல்லமாக அமைய வேண்டும் என்பதே எமது விருப்பம்."',
            '"Damit möchten wir auch für kommende Generationen einen festen Ort schaffen, an dem unser Glaube und unsere Tradition bewahrt und weitergegeben werden können. Über alle weiteren Schritte und den Fortschritt des Projekts werden wir transparent informieren.": "இதன் மூலம் வருங்காலத் தலைமுறைகளுக்கும் எமது சமயமும் பாரம்பரியமும் பாதுகாக்கப்பட்டு பகிரப்படும் ஒரு நிலையான இடத்தை உருவாக்க விரும்புகிறோம். திட்டத்தின் அடுத்தடுத்த நடவடிக்கைகள் மற்றும் முன்னேற்றம் குறித்து வெளிப்படையாகத் தகவல் வழங்குவோம்."': '"Damit möchten wir auch für kommende Generationen einen festen Ort schaffen, an dem unser Glaube und unsere Tradition bewahrt und weitergegeben werden können. Über alle weiteren Schritte und den Fortschritt des Projekts werden wir transparent informieren.": "எமது சமய நம்பிக்கையும் தமிழ் இந்து பாரம்பரியமும் வருங்காலத் தலைமுறைகளுக்கும் தொடர வேண்டும். அதற்கான ஒரு நிரந்தரமான ஆன்மிக மையமாக இந்த புதிய ஆலயம் அமைய வேண்டும் என்று நாம் விரும்புகிறோம். இந்த முயற்சியின் அடுத்தடுத்த கட்டங்கள் மற்றும் முன்னேற்றங்கள் குறித்து எமது பக்தர்களுக்கும் சமூகத்தினருக்கும் தொடர்ந்து தகவல் வழங்கப்படும்."'
          }
          for old, new in replacements.items():
              if old == new:
                  continue
              if old not in s:
                  raise SystemExit(f'Expected source not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit Tamil future update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Refine Tamil future section'
          git push origin main
