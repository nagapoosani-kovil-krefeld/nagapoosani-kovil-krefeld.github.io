  "Unser Sri Nagapoosani Ambaal Tempel befindet sich derzeit in einem angemieteten Gebäude in zentraler Lage der Krefelder Innenstadt. Der Tempel ist dadurch gut erreichbar, gleichzeitig stehen in der Umgebung jedoch nur begrenzte Parkmöglichkeiten zur Verfügung. Die derzeitigen Räumlichkeiten und der aktuelle Standort sind langfristig nicht passend für die Bedürfnisse einer wachsenden Tempelgemeinschaft und für größere religiöse Veranstaltungen. Dennoch ist dieser Ort für unsere Gemeinschaft sehr wertvoll.": "எமது ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம் தற்போது கிறிபில்ட் நகர மையத்தில் உள்ள வாடகைக் கட்டிடமொன்றில் இயங்கி வருகிறது. நகர மையத்தில் இருப்பதால் ஆலயத்திற்கு வருகை தருவது எளிதாக இருந்தாலும், அருகிலுள்ள வாகன நிறுத்த வசதி குறைவாக உள்ளது. வளர்ந்து வரும் எமது ஆலயச் சமூகத்தின் தேவைகளுக்கும் பெரிய சமய நிகழ்வுகளுக்கும் தற்போதைய இடவசதி நீண்டகாலத்திற்கு போதுமானதாக இல்லை. இருப்பினும், இவ்விடம் எமது சமூகத்திற்கு மிகவும் மதிப்புமிக்கதாக உள்ளது.",
  "Unsere Vision ist es, ein geeignetes Grundstück in Krefeld zu erwerben und darauf einen eigenen hinduistischen Tempel zu errichten. Der neue Tempel soll ein würdevoller und dauerhafter Ort für Poojas, religiöse Feste, tamilisch-hinduistische Tradition, kulturelle Begegnung und unsere Gemeinschaft werden.": "கிறிபில்டில் பொருத்தமான காணி ஒன்றை வாங்கி, எமக்கென நிரந்தரமான இந்து ஆலயத்தை அமைப்பதே எமது நீண்டகால நோக்கம். பூஜைகள், சமய விழாக்கள், தமிழ் இந்து மரபு, கலாசார நிகழ்வுகள் மற்றும் சமூக ஒன்றுகூடல்கள் நடைபெறும் கண்ணியமான நிரந்தர ஆன்மீக மையமாக புதிய ஆலயம் அமைய வேண்டும்.",
  "Damit möchten wir auch für kommende Generationen einen festen Ort schaffen, an dem unser Glaube und unsere Tradition bewahrt und weitergegeben werden können. Über alle weiteren Schritte und den Fortschritt des Projekts werden wir transparent informieren.": "வருங்கால சந்ததியினர் எமது சமயத்தையும் மரபையும் பேணிக் கற்று தொடரக்கூடிய நிலையான தலத்தை உருவாக்குவதே இதன் நோக்கம். திட்டத்தின் அடுத்த கட்டங்களையும் முன்னேற்றத்தையும் அனைவருக்கும் வெளிப்படையாகத் தெரிவிப்போம்.",
  "Besucht uns": "ஆலயத்திற்கு வருகை தருங்கள்",
  "Kontakt und Anfahrt": "தொடர்பு · வருகை வழி",
  "Tamilischer Kulturverein Krefeld e.V.": "கிறிபில்ட் தமிழ் கலாசாரச் சங்கம் e.V.",
  "· Tempel": "· ஆலயம்",
  "· Tempelverwalterin": "· ஆலய நிர்வாகி",
  "· Tempelpriester": "· ஆலயக் குரு",
