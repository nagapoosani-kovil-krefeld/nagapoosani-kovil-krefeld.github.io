          source, n1 = re.subn(
              r'const tamilText = \{.*?\n\};\n\nconst englishText = \{',
              tamil_text + '\n\nconst englishText = {',
              source,
              count=1,
              flags=re.S,
          )
          source, n2 = re.subn(
              r'const tamilAttributes = \{.*?\n\};\n\nconst englishAttributes = \{',
              tamil_attributes + '\n\nconst englishAttributes = {',
              source,
              count=1,
              flags=re.S,
          )

          old_title = '  ta: "ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம் கிரேபில்ட்",'
          new_title = '  ta: "கிறிபில்ட் ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம்",'
          old_desc = '  ta: "கிரேபில்ட் ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம் – நம்பிக்கை, தமிழ் இந்து பாரம்பரியம் மற்றும் சமூக ஒற்றுமைக்கான ஓர் இடம்.",'
          new_desc = '  ta: "கிறிபில்ட் ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம் – இறைநம்பிக்கை, தமிழ் இந்து மரபு மற்றும் சமூக ஒற்றுமை இணையும் திருத்தலம்.",'

          if old_title not in source or old_desc not in source:
              raise SystemExit('Tamil page metadata patterns not found')
          source = source.replace(old_title, new_title, 1).replace(old_desc, new_desc, 1)

          if n1 != 1 or n2 != 1:
              raise SystemExit(f'Unexpected replacement counts: tamilText={n1}, tamilAttributes={n2}')

          path.write_text(source, encoding='utf-8')
