name: Final release QA cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/final-release-qa-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply final QA cleanup
        shell: python
        run: |
          from pathlib import Path

          index = Path("index.html")
          html = index.read_text(encoding="utf-8")
          old_nav = '          <a href="#termine">Termine</a>\n          <a href="#galerie">Galerie</a>'
          new_nav = '          <a href="#termine">Termine</a>\n          <a href="#besuch">Erster Besuch</a>\n          <a href="#galerie">Galerie</a>'
          if old_nav not in html:
              raise SystemExit("Desktop navigation target not found")
          html = html.replace(old_nav, new_nav, 1)
          html = html.replace('styles.css?v=20260820-9', 'styles.css?v=20260821-1', 1)
          html = html.replace('script.js?v=20260820-11', 'script.js?v=20260821-1', 1)
          index.write_text(html, encoding="utf-8")

          styles = Path("styles.css")
          css = styles.read_text(encoding="utf-8")
          old_tamil_fallback = 'html[lang="ta"] .schedule-row.holy-day strong::after { content: "✦ புனித நாள்"; }\n'
          if old_tamil_fallback not in css:
              raise SystemExit("Old Tamil holy-day fallback not found")
          css = css.replace(old_tamil_fallback, '', 1)
          styles.write_text(css, encoding="utf-8")

          script = Path("script.js")
          js = script.read_text(encoding="utf-8")
          obsolete = '  "Im Anschluss an das Abhishekam findet die gemeinsame Pooja statt. Dabei werden Mantras rezitiert sowie Deepa Aradhanai und besondere Verehrungen durchgeführt. Zum Abschluss erhalten die Gläubigen Vibhuti und Prasadam. Dabei werden Mantras rezitiert sowie Deepa Aradhanai und besondere Verehrungen durchgeführt. Zum Abschluss erhalten die Gläubigen Vibhuti und Prasadam. Die jeweiligen Beginnzeiten finden Sie im Wochenplan.": "The communal Pooja takes place after Abhishekam. The respective starting times can be found in the weekly schedule.",\n'
          if obsolete not in js:
              raise SystemExit("Obsolete duplicate Pooja key not found")
          js = js.replace(obsolete, '', 1)
          script.write_text(js, encoding="utf-8")
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html styles.css script.js
          git commit -m "Finalize release QA cleanup"
          git push origin main
