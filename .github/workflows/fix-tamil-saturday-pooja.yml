name: Fix Tamil Saturday Pooja duplicate

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove duplicate Tamil Saturday Pooja label
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<span class="schedule-lang schedule-lang-ta">ஆஞ்சநேயர் பூஜை · 12:00 மணி</span>'
          new = '<span class="schedule-lang schedule-lang-ta">12:00 மணி</span>'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one Tamil Saturday Pooja label, found {count}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/fix-tamil-saturday-pooja.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/fix-tamil-saturday-pooja.yml
          git diff --cached --quiet && exit 0
          git commit -m "Remove duplicate Tamil Saturday Pooja label"
          git push origin HEAD:main
