name: Update Tamil special days heading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-tamil-special-days-heading.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Tamil heading only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          old = '"Besondere heilige Tage": "விசேட புனித நாட்கள்"'
          new = '"Besondere heilige Tage": "விசேட பூஜை நாட்கள்"'
          if old not in s:
              raise SystemExit('Expected Tamil heading not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Update Tamil special days heading'
          git push
