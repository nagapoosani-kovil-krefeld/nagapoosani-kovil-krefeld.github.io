name: Apply header logo style

on:
  push:
    branches:
      - agent/tamil-natural-review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tamil-natural-review
      - name: Append logo overrides
        shell: bash
        run: |
          cat >> styles.css <<'CSS'

/* Header logo refinement */
.brand img {
  width: 56px;
  height: 56px;
  object-fit: contain;
  background: transparent;
  border-radius: 0;
  box-shadow: none;
}

@media (max-width: 820px) {
  .brand img {
    width: 56px;
    height: 56px;
  }
}
CSS
          git rm .github/workflows/apply-logo-style.yml
      - name: Commit logo style
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css .github/workflows/apply-logo-style.yml
          git commit -m "Refine header logo styling"
          git push origin HEAD:agent/tamil-natural-review
