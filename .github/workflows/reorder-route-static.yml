name: Reorder route options

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorder-route-static.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Put Apple Maps first
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '''            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Elisabethstra%C3%9Fe+103-105%2C+47799+Krefeld" target="_blank" rel="noreferrer">Google Maps</a>\n            <a href="https://maps.apple.com/?daddr=Elisabethstra%C3%9Fe%20103-105%2C%2047799%20Krefeld&amp;dirflg=d" target="_blank" rel="noreferrer">Apple Maps</a>'''
          new = '''            <a href="https://maps.apple.com/?daddr=Elisabethstra%C3%9Fe%20103-105%2C%2047799%20Krefeld&amp;dirflg=d" target="_blank" rel="noreferrer">Apple Maps</a>\n            <a href="https://www.google.com/maps/dir/?api=1&amp;destination=Elisabethstra%C3%9Fe+103-105%2C+47799+Krefeld" target="_blank" rel="noreferrer">Google Maps</a>'''
          if old not in s:
              raise SystemExit('Expected route option block not found')
          s = s.replace(old, new, 1)
          s = s.replace('script.js?v=20260821-3', 'script.js?v=20260821-4', 1)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html
          git commit -m "Prioritize Apple Maps on Apple devices"
          git push origin main
