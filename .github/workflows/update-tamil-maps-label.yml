name: Update Tamil Maps label

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-tamil-maps-label.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update Tamil Google Maps button label
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text()
          old = '"Route öffnen": "வருகை வழியைப் பார்க்க",'
          new = '"Route öffnen": "ஆலயத்திற்கு வழிகாட்டி",'
          if old not in s:
              raise SystemExit('Expected Tamil Route öffnen mapping not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          old = 'script.js?v=20260821-1'
          new = 'script.js?v=20260821-2'
          if old in s:
              s = s.replace(old, new, 1)
              p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- script.js index.html
          git commit -m "Refine Tamil maps button label"
          git push origin main
