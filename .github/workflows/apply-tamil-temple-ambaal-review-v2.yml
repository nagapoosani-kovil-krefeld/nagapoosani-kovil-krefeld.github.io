name: Apply approved Tamil temple and Ambaal copy

on:
  push:
    branches: [agent/tamil-natural-review-v2]
    paths:
      - '.github/workflows/apply-tamil-temple-ambaal-review-v2.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/tamil-natural-review-v2
      - name: Apply approved Tamil copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          old_temple = '"Der Sri Nagapoosani Ambaal Tempel Krefeld ist ein Ort des Gebets, der tamilisch-hinduistischen Tradition und der Begegnung. Getragen vom Tamilischen Kulturverein Krefeld e.V. bietet der Tempel unserer Gemeinschaft einen gemeinsamen Ort für Poojas, religiöse Feste und kulturelles Leben. Auch Menschen, die unseren Glauben und unsere Tradition kennenlernen möchten, sind herzlich willkommen.": "கிறிபில்ட் ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம் வழிபாடு, தமிழ் இந்து பாரம்பரியம் மற்றும் மக்களின் சந்திப்புக்கான இடமாகும். கிறிபில்ட் தமிழ் கலாசாரச் சங்கத்தால் நடத்தப்படும் இவ்வாலயம், பூஜைகள், சமய விழாக்கள் மற்றும் கலாசார நிகழ்வுகளுக்காக எமது சமூகத்தை ஒன்றிணைக்கிறது. எமது சமயத்தையும் பாரம்பரியத்தையும் அறிந்துகொள்ள விரும்பும் அனைவரையும் அன்புடன் வரவேற்கிறோம்."'
          new_temple = '"Der Sri Nagapoosani Ambaal Tempel Krefeld ist ein Ort des Gebets, der tamilisch-hinduistischen Tradition und der Begegnung. Getragen vom Tamilischen Kulturverein Krefeld e.V. bietet der Tempel unserer Gemeinschaft einen gemeinsamen Ort für Poojas, religiöse Feste und kulturelles Leben. Auch Menschen, die unseren Glauben und unsere Tradition kennenlernen möchten, sind herzlich willkommen.": "கிறிபில்ட் ஸ்ரீ நாகபூசணி அம்பாள் ஆலயம் ஒரு வழிபாட்டுத் தலம் மட்டுமல்ல; எமது மக்களின் ஆன்மீக வாழ்க்கையோடு இணைந்த ஒரு முக்கியமான இடமாகவும் விளங்குகிறது. கிறிபில்ட் தமிழ் கலாசாரச் சங்கம் e.V. நிர்வகிக்கும் இவ்வாலயத்தில் தினசரி பூஜைகள், விசேஷ வழிபாடுகள், சமய விழாக்கள் மற்றும் கலாசார நிகழ்வுகள் நடைபெற்று வருகின்றன. பெரியோர்கள் முதல் இளைய தலைமுறையினர் வரை அனைவரும் ஒன்றிணைந்து, சமய அறிவையும் சமூக உறவையும் பகிர்ந்து கொள்ளும் இடமாகவும் எமது ஆலயம் திகழ்கிறது. ஆலயத்திற்கு வருகை தரும் அனைவரையும் அன்புடன் வரவேற்கிறோம்."'
          old_ambaal = '"Im Mittelpunkt unseres Tempels steht Sri Nagapoosani Ambaal. Sie wird von unserer Gemeinschaft als schützende und segenspendende Göttin verehrt. Durch Gebete, Poojas und gemeinsame Feste bewahren wir unsere Traditionen und geben sie an die nächste Generation weiter.": "எமது ஆலயத்தின் பிரதான தெய்வமாக ஸ்ரீ நாகபூசணி அம்பாள் விளங்குகிறார். எமது சமூகத்தினர் அம்பாளை பாதுகாப்பும் அருளும் வழங்கும் தெய்வமாகப் போற்றி வழிபடுகின்றனர். பிரார்த்தனைகள், பூஜைகள் மற்றும் ஒன்றிணைந்த விழாக்கள் மூலம் எமது பாரம்பரியத்தைப் பேணிப் பாதுகாத்து அடுத்த தலைமுறைக்கு எடுத்துச் செல்கிறோம்."'
          new_ambaal = '"Im Mittelpunkt unseres Tempels steht Sri Nagapoosani Ambaal. Sie wird von unserer Gemeinschaft als schützende und segenspendende Göttin verehrt. Durch Gebete, Poojas und gemeinsame Feste bewahren wir unsere Traditionen und geben sie an die nächste Generation weiter.": "எமது ஆலயத்தின் பிரதான தெய்வமாக ஸ்ரீ நாகபூசணி அம்பாள் எழுந்தருளி அருள்பாலித்து வருகின்றார். தம்மை நம்பிக்கையுடன் நாடி வருவோருக்கு தாயின் அரவணைப்பைப் போன்று நலம், பாதுகாப்பு, மனநிம்மதி மற்றும் வாழ்வில் வளம் கிடைக்கும் என்ற நம்பிக்கையுடன் பக்தர்கள் வழிபடுகின்றனர். மனதில் தாங்கி வரும் வேண்டுதல்கள், கவலைகள் மற்றும் நன்றிகளை திருவடிகளில் சமர்ப்பித்து, வாழ்க்கைப் பயணத்தில் துணையும் வழிகாட்டுதலும் வேண்டுகின்றனர். அதேபோல் உலகில் அநீதி அகன்று நீதி நிலைக்கவும், துன்பங்கள் குறைந்து மக்கள் அமைதியுடனும் ஒற்றுமையுடனும் வாழவும் அம்பாளை வேண்டிப் பிரார்த்திக்கின்றனர். அபிஷேகம், பூஜை, அர்ச்சனை மற்றும் விசேஷ வழிபாடுகள் வழியாக இந்த இறைநம்பிக்கை தலைமுறைகள் கடந்தும் தொடர்ந்து வருகிறது."'
          for old, new in [(old_temple, new_temple), (old_ambaal, new_ambaal)]:
              if old not in s:
                  raise SystemExit('Expected approved-source text not found')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit approved changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git diff --cached --quiet || git commit -m "Refine Tamil temple and Ambaal copy"
          git push origin agent/tamil-natural-review-v2
