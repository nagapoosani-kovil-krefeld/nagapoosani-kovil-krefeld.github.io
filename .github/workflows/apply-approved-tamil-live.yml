name: Apply approved Tamil copy live

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-approved-tamil-live.yml

permissions:
  contents: write

# Trigger the approved live update.
jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Apply approved Tamil copy
        shell: python
        run: |
          from pathlib import Path

          script = Path('script.js')
          text = script.read_text(encoding='utf-8')

          old_tagline = 'இறைநம்பிக்கையும், தமிழ் இந்து மரபும், சமூக ஒற்றுமையும் இணையும் திருத்தலம்.'
          new_tagline = 'இறைவழிபாடும் சமூக ஒற்றுமையும் நிறைந்த புனிதத் தலம்.'

          old_generation = 'அபிஷேகம், பூஜை, அர்ச்சனை மற்றும் விசேஷ வழிபாடுகள் வழியாக இந்த இறைநம்பிக்கை தலைமுறைகள் கடந்தும் தொடர்ந்து வருகிறது.'
          new_generation = 'அபிஷேகம், பூஜை, அர்ச்சனை மற்றும் விசேஷ வழிபாடுகள் வழியாக இந்த இறைநம்பிக்கை தலைமுறை தலைமுறையாகப் பேணிப் பாதுகாக்கப்படுகிறது. இன்றைய இளைய தலைமுறையினர் ஆலயப் பணிகளில் செயற்பாட்டுடன் பங்கேற்று, பொறுப்புகளை ஏற்று வருகின்றனர். அவர்களின் பங்களிப்பின் மூலம் ஆலயத்தின் வழிபாடு, சேவை மற்றும் சமூகப் பணி வருங்காலத்திலும் தொடர்ந்து வளர வேண்டும் என்பதே எமது நோக்கம்.'

          if old_tagline not in text:
              raise SystemExit('Expected approved tagline source not found; refusing unrelated changes.')
          if old_generation not in text:
              raise SystemExit('Expected generation source not found; refusing unrelated changes.')

          text = text.replace(old_tagline, new_tagline, 1)
          text = text.replace(old_generation, new_generation, 1)
          script.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          old_script = 'script.js?v=20260820-2'
          new_script = 'script.js?v=20260820-3'
          if old_script not in html:
              raise SystemExit('Expected script cache version not found; refusing unrelated changes.')
          index.write_text(html.replace(old_script, new_script, 1), encoding='utf-8')

      - name: Commit live Tamil update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- script.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Publish approved Tamil copy"
          git push origin main
