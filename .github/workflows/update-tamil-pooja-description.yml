name: Update Tamil Pooja description

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/update-tamil-pooja-description.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Update approved Tamil Pooja description only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('script.js')
          s = p.read_text(encoding='utf-8')
          old = '"Im Anschluss an das Abhishekam findet die gemeinsame Pooja statt. Die jeweiligen Beginnzeiten finden Sie im Wochenplan.": "அபிஷேகம் நிறைவடைந்த பின்னர் பொதுப் பூஜை நடைபெறும். அன்றைய பூஜை ஆரம்ப நேரத்தை வார அட்டவணையில் காணலாம்."'
          new = '"Im Anschluss an das Abhishekam findet die gemeinsame Pooja statt. Die jeweiligen Beginnzeiten finden Sie im Wochenplan.": "அபிஷேகம் நிறைவடைந்த பின்னர் பொதுப் பூஜை நடைபெறும். இந்த நேரத்தில் ஆலயத்தில் ஒரு அமைதியான மற்றும் பக்தி நிறைந்த சூழல் உருவாகிறது. மந்திரங்கள் ஓதப்பட்டு, தீபாராதனை மற்றும் விசேஷ வழிபாடுகள் நடைபெறும் போது, வருகை தரும் அனைவரும் அமைதியாக இருந்து அம்பாளை தரிசிக்கலாம். குடும்பத்தினருடன் அல்லது தனியாக வருபவர்களாக இருந்தாலும், பூஜையில் கலந்து கொள்வது ஆலய வாழ்க்கையின் முக்கியமான ஒரு பகுதியாகும். பூஜையின் நிறைவில் தீபாராதனையை தரிசித்து, திருநீறு மற்றும் பிரசாதம் பெற்றுக்கொள்ளலாம். அன்றைய பூஜை ஆரம்ப நேரத்தை வார அட்டவணையில் காணலாம்."'
          if old not in s:
              raise SystemExit('Expected Tamil Pooja source text not found; no changes made.')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit live text update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add script.js
          git commit -m 'Expand Tamil Pooja description'
          git push origin main
