name: Restore contact heading accent

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore heading accent only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('styles.css')
          text = path.read_text(encoding='utf-8')
          old = '.contact-section h2::after { display: none; }'
          new = '.contact-section h2::after { width: 48px; margin-top: 14px; }'
          if old not in text:
              raise SystemExit('Expected hidden contact accent rule not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit accent restore
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css
          git diff --cached --quiet && exit 0
          git commit -m "Restore contact heading accent"
          git push origin HEAD:main