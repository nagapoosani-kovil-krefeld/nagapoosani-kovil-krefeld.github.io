name: Apply English content alignment

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-english-content-alignment.yml

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align approved English content
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('script.js')
          text = path.read_text(encoding='utf-8')

          replacements = {
            'A place of faith, Tamil Hindu tradition and community.': 'A sacred place of worship, faith and community.',
            'Faith · Tradition · Community': 'Faith · Worship · Community',
            'The Sri Nagapoosani Ambaal Temple Krefeld is a place of prayer, Tamil Hindu tradition and gathering. Run by the Tamil Cultural Association Krefeld e.V., the temple provides our community with a shared place for Poojas, religious festivals and cultural life. Everyone who would like to learn about our faith and traditions is warmly welcome.': 'The Sri Nagapoosani Ambaal Temple Krefeld is a place of prayer, worship and community. Run by the Tamil Cultural Association Krefeld e.V., the temple hosts regular Poojas, special worship services, religious festivals and cultural events. People of all generations come together here to practise their faith and experience community. Visitors are warmly welcome.',
            'At the heart of our temple is Sri Nagapoosani Ambaal. Our community worships her as a protective goddess who bestows her blessings. Through prayers, Poojas and shared festivals, we preserve our traditions and pass them on to the next generation.': 'At the heart of our temple is Sri Nagapoosani Ambaal. Devotees worship her as a protective and blessing-giving goddess and bring their wishes, worries and gratitude before Ambaal with trust. They pray for health, protection, inner peace and well-being for themselves and their families, as well as for peace, justice and unity. Through Abhishekam, Poojas, Archanai and special forms of worship, this faith is carried forward from generation to generation. Some members of the younger generation already take part in temple responsibilities and are gradually taking on greater responsibility. For the future, we hope that more young people will join and help carry forward the religious, social and community life of the temple.',
            'During Abhishekam, Sri Nagapoosani Ambaal is ritually bathed and worshipped. At every Abhishekam, devotees can purchase': 'During Abhishekam, Sri Nagapoosani Ambaal is ritually bathed and worshipped. Devotees may obtain',
            'milk for €2': 'milk for the Abhishekam for €2',
            'at reception and offer it to the goddess.': 'at reception and offer it as an offering.',
            'The communal Pooja takes place after Abhishekam.': 'The communal Pooja takes place after Abhishekam. Mantras are recited, followed by Deepa Aradhanai and other special forms of worship. At the end, devotees receive Vibhuti and Prasadam.',
            'Traditional Temple Music': 'Nadaswaram · Thavil Music',
            'Our vision is to purchase a suitable plot of land in Krefeld and build our own Hindu temple. The new temple will be a dignified and permanent home for Poojas, religious festivals, Tamil Hindu tradition, cultural exchange and our community.': 'Our vision is to purchase a suitable plot of land in Krefeld and build our own Hindu temple. The new temple should become a dignified and permanent home for Poojas, religious festivals, cultural events and community gatherings.',
            'In this way, we aim to create a lasting place for future generations where our faith and traditions can be preserved and passed on. We will provide transparent updates about the next steps and the progress of the project.': 'Our faith and the religious life of our temple should continue for future generations. We hope to create a permanent spiritual home for this purpose. We will provide transparent updates about the next steps and the progress of the project.',
            'Open traditional temple music in a large view': 'Open Nadaswaram and Thavil music in a large view',
            'Sri Nagapoosani Ambaal Temple Krefeld – a place of faith, Tamil Hindu tradition and community.': 'Sri Nagapoosani Ambaal Temple Krefeld – a sacred place of worship, faith and community.'
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected English text not found: {old[:100]}')
              text = text.replace(old, new)

          path.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html, count = re.subn(r'script\.js\?v=(\d{8})-(\d+)', lambda m: f"script.js?v={m.group(1)}-{int(m.group(2))+1}", html, count=1)
          if count != 1:
              raise SystemExit('Script cache-bust reference not found')
          index.write_text(html, encoding='utf-8')

      - name: Commit approved English copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- script.js index.html
          git diff --cached --quiet && exit 0
          git commit -m "Align English content with final temple copy"
          git push origin main
