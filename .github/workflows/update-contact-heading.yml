name: Update Tamil contact heading

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Tamil contact heading only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('script.js')
          text = path.read_text(encoding='utf-8')
          old = '  "Kontakt und Anfahrt": "தொடர்பு மற்றும் வருகை வழி",'
          new = '  "Kontakt und Anfahrt": "ஆலயத் தொடர்பு மற்றும் முகவரி",'
          if old not in text:
              raise SystemExit('Expected Tamil contact heading not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add script.js
          git diff --cached --quiet && exit 0
          git commit -m "Update Tamil contact heading"
          git push origin HEAD:main
