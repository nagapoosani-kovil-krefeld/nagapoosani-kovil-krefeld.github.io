name: Fix duplicated German Pooja text

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-german-content-alignment.yml

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove duplicated German Pooja sentences
        shell: python
        run: |
          from pathlib import Path
          import re

          duplicated = 'Im Anschluss an das Abhishekam findet die gemeinsame Pooja statt. Dabei werden Mantras rezitiert sowie Deepa Aradhanai und besondere Verehrungen durchgeführt. Zum Abschluss erhalten die Gläubigen Vibhuti und Prasadam. Dabei werden Mantras rezitiert sowie Deepa Aradhanai und besondere Verehrungen durchgeführt. Zum Abschluss erhalten die Gläubigen Vibhuti und Prasadam.'
          clean = 'Im Anschluss an das Abhishekam findet die gemeinsame Pooja statt. Dabei werden Mantras rezitiert sowie Deepa Aradhanai und besondere Verehrungen durchgeführt. Zum Abschluss erhalten die Gläubigen Vibhuti und Prasadam.'

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          if duplicated not in html:
              raise SystemExit('Duplicated German Pooja text not found in index.html')
          html = html.replace(duplicated, clean, 1)
          html, count = re.subn(r'script\.js\?v=(\d{8})-(\d+)', lambda m: f"script.js?v={m.group(1)}-{int(m.group(2))+1}", html, count=1)
          if count != 1:
              raise SystemExit('Script cache-bust reference not found')
          index.write_text(html, encoding='utf-8')

          script = Path('script.js')
          js = script.read_text(encoding='utf-8')
          if duplicated not in js:
              raise SystemExit('Duplicated German Pooja text not found in script.js')
          js = js.replace(duplicated, clean, 1)
          script.write_text(js, encoding='utf-8')

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- index.html script.js
          git diff --cached --quiet && exit 0
          git commit -m "Fix duplicated German Pooja copy"
          git push origin main
