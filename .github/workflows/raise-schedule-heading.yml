name: Raise schedule heading

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/raise-schedule-heading.yml'

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Align schedule heading to top
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('styles.css')
          s = p.read_text(encoding='utf-8')
          anchor = 'html[lang="ta"] .intro-section .split { align-items: start; }'
          addition = anchor + '\n#termine .split { align-items: start; }'
          if '#termine .split { align-items: start; }' in s:
              raise SystemExit('Schedule heading alignment already applied.')
          if anchor not in s:
              raise SystemExit('Expected CSS anchor not found; no changes made.')
          p.write_text(s.replace(anchor, addition, 1), encoding='utf-8')
          PY
      - name: Commit layout adjustment
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add styles.css
          git commit -m 'Align schedule heading to top'
          git push origin main
