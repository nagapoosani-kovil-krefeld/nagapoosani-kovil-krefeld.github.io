name: Reorder route options by device

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/reorder-route-options.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reorder route options by device
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('script.js')
          s = p.read_text()
          old = '''function updateRouteOptionsForDevice() {
  if (!routeDialog) return;
  const ua = navigator.userAgent || "";
  const isAndroid = /Android/i.test(ua);
  const appleMapsLink = routeDialog.querySelector('a[href*="maps.apple.com"]');
  if (appleMapsLink) appleMapsLink.hidden = isAndroid;
}'''
          new = '''function updateRouteOptionsForDevice() {
  if (!routeDialog) return;
  const ua = navigator.userAgent || "";
  const isAndroid = /Android/i.test(ua);
  const isAppleMobile = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  const options = routeDialog.querySelector(".route-options");
  const googleMapsLink = routeDialog.querySelector('a[href*="google.com/maps"]');
  const appleMapsLink = routeDialog.querySelector('a[href*="maps.apple.com"]');
  const wazeLink = routeDialog.querySelector('a[href*="waze.com"]');

  if (appleMapsLink) appleMapsLink.hidden = isAndroid;

  if (options && isAppleMobile && appleMapsLink) {
    options.prepend(appleMapsLink);
    if (googleMapsLink) options.append(googleMapsLink);
    if (wazeLink) options.append(wazeLink);
  } else if (options && isAndroid) {
    if (googleMapsLink) options.prepend(googleMapsLink);
    if (wazeLink) options.append(wazeLink);
  }
}'''
          if old not in s:
              raise SystemExit('Expected device route function not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          for old_version in ['script.js?v=20260821-4','script.js?v=20260821-3']:
              if old_version in s:
                  s = s.replace(old_version, 'script.js?v=20260821-5', 1)
                  break
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- script.js index.html
          git commit -m "Prioritize Apple Maps on iPhone"
          git push origin main
